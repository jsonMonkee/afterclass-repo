[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterclass-api"
version = "0.1.0"
description = "FastAPI backend for Afterclass"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "supabase>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = [
  "app",
  "app.core",
  "app.modules",
  "app.modules.clubs",
  "app.modules.auth",
  "app.modules.dhanda",
  "app.modules.diagnostics",
  "app.modules.health",
  "app.modules.opportunities",
  "app.modules.payments",
  "app.modules.uploads",
  "app.integrations",
]
